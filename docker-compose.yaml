version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: web-personalize-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personalize
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d      # seed scripts live here